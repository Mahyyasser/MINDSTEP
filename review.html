<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test Review</title>

    <link rel="stylesheet" href="css/review.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="Header">

        <div class="logo">
            <img src="ChatGPT_Image_Aug_16__2026__09_27_09_PM-removebg-preview.png" alt="Mind Step">
        </div>

        <div class="title">
            Test Review
        </div>

        <div class="header-actions">

            <button class="back-btn" id="backToTest">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                 <span>Exit Test</span>
            </button>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <div class="review-container">

        <!-- ================= REVIEW TOP ================= -->

        <section class="review-top">

            <div class="review-title">

                <div class="review-icon">
                    <i class="fa-solid fa-clipboard-check"></i>
                </div>

                <div>
                    <h1>Test Review</h1>
                    <p>Review your answers and see the correct answers.</p>
                </div>

            </div>


            <div class="review-result">

                <span class="result-label">
                    Your Score
                </span>

                <strong id="score">
                    0 / 0
                </strong>

            </div>

        </section>


        <!-- ================= QUESTIONS ================= -->

        <section id="reviewQuestions" class="review-questions">

        </section>


        <!-- ================= BOTTOM ================= -->

        <div class="review-bottom">

            <button id="backToTestBottom">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Result

            </button>

        </div>

    </div>


    <script src="js/review.js"></script>

</body>
</html>
